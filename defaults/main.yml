---
ludus_jenkins_url: "http://jenkins:8080"
ludus_jenkins_agent_name: "{{ inventory_hostname }}"
ludus_jenkins_agent_labels: "linux-generic"
ludus_jenkins_agent_workdir: /opt/jenkins-agent
ludus_jenkins_agent_user: jenkins
ludus_jenkins_agent_install_docker: true
ludus_jenkins_agent_jar_version: "latest"
ludus_jenkins_agent_executors: 2

# JRE package for the agent. Defaults to OpenJDK 17, which is present in the
# Debian 12 (bookworm) / Ubuntu 22.04 main repos and is supported by current
# Jenkins. OpenJDK 21 is NOT in bookworm main (only bookworm-backports), so
# override this only on a distro where your chosen JDK is actually available.
ludus_jenkins_agent_java_package: openjdk-17-jre-headless
